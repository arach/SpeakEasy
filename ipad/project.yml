name: SpeakEasyPad

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: false

targets:
  SpeakEasyPad:
    type: application
    platform: iOS
    sources:
      - path: SpeakEasyPad/Sources
    info:
      path: SpeakEasyPad/Info.plist
      properties:
        CFBundleDisplayName: SpeakEasy Pad
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _http._tcp
          - _speakeasy-pad._tcp
        NSCameraUsageDescription: SpeakEasy Pad scans the connection code shown by SpeakEasy on your Mac.
        NSLocalNetworkUsageDescription: SpeakEasy Pad connects directly to SpeakEasy on your Mac to control voice lanes and playback.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speakeasy.pad
        PRODUCT_NAME: SpeakEasy Pad
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false

schemes:
  SpeakEasyPad:
    build:
      targets:
        SpeakEasyPad: all
    run:
      config: Debug
    archive:
      config: Release
