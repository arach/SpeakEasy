name: SpeakEasyDeck
packages:
  # HudsonVoice carries the embedded Parakeet dictation stack (VoxEngine +
  # CoreML) that makes transcription a device-local concern. Consumed from the
  # sibling checkout, the same way Scout's iOS app does — the macOS app's
  # prebuilt HudsonKit XCFrameworks are macOS-only and ship no voice product.
  Hudson:
    path: ../../../hudson
options:
  bundleIdPrefix: dev.arach
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 2U83JFPW66
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  SpeakEasyDeck:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        type: group
      # Must stay a single file reference, not a group. As a group, xcodegen
      # recurses and adds the PNGs as loose resources, actool never runs, no
      # Assets.car is produced, and the built Info.plist carries no icon keys
      # at all -- so iOS shows the default icon no matter what the PNGs contain.
      - path: Assets.xcassets
    dependencies:
      - package: Hudson
        product: HudsonVoice
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: SpeakEasy Pad
        # Take the version from the build settings below rather than pinning it
        # here. Without these two lines xcodegen writes a literal 1.0/1 and
        # MARKETING_VERSION is silently ignored — the build reports a version
        # nobody set.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The app speaks to the Mac over HTTPS and transcribes on device. That
        # is exempt encryption, so declaring it here spares a manual compliance
        # answer on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _http._tcp
        NSLocalNetworkUsageDescription: SpeakEasy Deck finds and drives your Mac over your local network.
        NSMicrophoneUsageDescription: Hold to Speak transcribes your voice on this device so your Mac can answer.
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.arach.speakeasy.deck
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        # Tells actool which set in Assets.xcassets is the app icon, and makes
        # it emit CFBundleIcons/CFBundleIconName into the built Info.plist.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

schemes:
  SpeakEasyDeck:
    build:
      targets:
        SpeakEasyDeck: all
    run:
      config: Debug
    archive:
      config: Release
